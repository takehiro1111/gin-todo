services:
  gin-todo-postgres:
    image: postgres:18.0-alpine3.22
    container_name: gin-todo-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      DB_PORT: 5432
    restart: always
    ports:
      - 5432:5432
    volumes:
      - db-store:/var/lib/postgresql/data # コンテナを削除してもデータは残る
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - todo-network

  adminer:
    image: adminer
    restart: always
    ports:
      - 9090:8080
    networks:
      - todo-network
    depends_on:
      gin-todo-postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gin-todo-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    networks:
      - todo-network
    depends_on:
      gin-todo-postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gin-todo-frontend
    ports:
      - "3000:3000"
    networks:
      - todo-network
    depends_on:
      - backend

  ses-local:
    image: oven/bun
    command: bunx aws-ses-v2-local@2.5.1 --host=0.0.0.0
    ports:
      - "8005:8005"

volumes:
  db-store:

networks:
  todo-network:
    driver: bridge
