services:
  gin-todo-postgres:
    image: postgres:18.0-alpine3.22
    container_name: gin-todo-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_PORT: 5432
    restart: always
    ports:
      - 5432:5432
    volumes:
      - db-store:/var/lib/postgresql/data # コンテナを削除してもデータは残る
      - ./backend/migrations:/docker-entrypoint-initdb.d
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - todo-network

  adminer:
    image: adminer
    restart: always
    ports:
      - 9090:8080
    networks:
      - todo-network
    depends_on:
      gin-todo-postgres:
        condition: service_healthy
    
volumes:
  db-store:

networks:
  todo-network: 
    driver: bridge
